<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A cosy craft-themed memory game. Find six matching pairs in as few moves as possible."
  >

  <title>Yarn &amp; Found — Little Games Club</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <a class="back-link" href="../../index.html#games">
    ← Back to Little Games Club
  </a>

  <main class="game">
    <header class="game-header">
      <h1>Yarn &amp; Found</h1>
      <p>A little patience. A perfect pair.</p>
    </header>

    <div class="game-layout">
      <section
        class="board-panel"
        aria-labelledby="board-heading"
      >
        <h2 id="board-heading" class="visually-hidden">
          Memory cards
        </h2>

        <div id="card-grid" class="card-grid"></div>
      </section>

      <aside
        class="game-sidebar"
        aria-labelledby="project-heading"
      >
        <h2 id="project-heading">Your little project</h2>

        <span class="stitched-divider" aria-hidden="true">♡</span>

        <div class="statistics">
          <p>Moves: <span id="moves">0</span></p>
          <p>Pairs: <span id="pairs">0</span> / 6</p>
        </div>

        <label class="visually-hidden" for="pair-progress">
          Matching pairs found
        </label>

        <progress
          id="pair-progress"
          max="6"
          value="0"
        ></progress>

        <button id="new-game-button" type="button">
          New game
        </button>

        <p id="game-message" role="status">
          Turn over two cards to find a matching pair.
        </p>

        <span class="stitched-divider" aria-hidden="true">♡</span>

        <p class="best-score">
          Best: <span id="best-score">—</span>
        </p>

        <img
          class="craft-basket"
          src="images/craft-basket.png"
          alt=""
        >
      </aside>
    </div>
  </main>
</body>
</html>
